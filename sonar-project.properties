# ── Project identity ─────────────────────────────────────────
sonar.projectKey=datawarlock1_etihad-data-platform
sonar.organization=datawarlock1
sonar.projectName=Etihad Data Platform
sonar.projectVersion=1.0

# ── Source and test paths ─────────────────────────────────────
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10

# ── Coverage report (generated by pytest-cov) ─────────────────
sonar.python.coverage.reportPaths=coverage.xml

# ── Exclusions ───────────────────────────────────────────────
# Don't scan virtual env, migrations, or notebook checkpoints
sonar.exclusions=**/__pycache__/**,**/.ipynb_checkpoints/**,**/venv/**

# ── Encoding ──────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
